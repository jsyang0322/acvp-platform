[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acvp-server"
version = "0.1.0"
description = "ACVP validation platform — server-client / protocol layer (FIPS 203/204)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt>=2.8",
  "arq>=0.25",
  # Persistence (PostgreSQL). psycopg v3 sync driver — URL scheme
  # postgresql+psycopg://. The engine is created lazily, so these are inert until
  # DATABASE_URL is set (the app still runs on the in-memory store without them).
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
