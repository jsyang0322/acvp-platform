# Alembic configuration for the ACVP server persistence layer.
#
# The database URL is NOT stored here — alembic/env.py injects it from the app
# settings (DATABASE_URL) at runtime, so no connection secret ever lands in the
# repo. Run migrations from backend/ with DATABASE_URL set, e.g.:
#   DATABASE_URL=postgresql+psycopg://acvp:...@localhost:5432/acvp alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
# Left blank on purpose: env.py sets sqlalchemy.url from DATABASE_URL.
sqlalchemy.url =

# --- Logging -----------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
