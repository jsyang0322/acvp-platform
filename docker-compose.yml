services:
  # FastAPI backend + the NIST GenVal engine (Orleans silo + runner) in one
  # container, all on localhost — see backend/Dockerfile for why. Set
  # USE_NIST_GENVAL=false to run the fixture stub (no engine) instead.
  backend:
    build:
      context: ./backend
      target: backend
    # SECURITY: Do NOT expose port 8000 to the host. The backend is only
    # reachable via the Docker internal network through the Nginx proxy.
    # This prevents attackers from bypassing TLS/mTLS by connecting directly.
    expose:
      - "8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DEMO_PASSWORD=acvp-demo
      - FIXTURES_DIR_OVERRIDE=/fixtures
      - USE_NIST_GENVAL=true # grade with the real engine; false = fixture stub
      - MTLS_ENABLED=true
      # Required (fail-closed): set in the shell or a repo-root .env file.
      # Generate: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - PROXY_SECRET=${PROXY_SECRET:?PROXY_SECRET is required - see docs/mtls-deployment.md}
      # PostgreSQL — reaches the `db` service over the compose network. Dev-only
      # default; override DATABASE_URL / POSTGRES_* in a repo-root .env for deploy.
      # Inert this phase (the app still uses the in-memory store); wired now so the
      # next phase — the DB-backed store — needs no compose change.
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://acvp:acvp-dev-only@db:5432/acvp}
    volumes:
      - ./tests/fixtures/nist:/fixtures:ro # golden vectors, read-only (fallback + tests)
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s # the Orleans silo takes ~20-40s to come up first
    # NOTE: no `depends_on: db` yet — the app still runs on the in-memory store, so
    # ordering isn't needed, and the CI mTLS job (`up ... backend proxy`) must not
    # pull in Postgres. The next phase (DB-backed store) adds the service_healthy gate.

  # PostgreSQL — the persistent store. Data lives in the named `pgdata` volume
  # (not the repo, not a local SQLite file); it survives `down` and is removed only
  # by `down -v`. Runs the same under `docker compose` and `podman compose`.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-acvp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-acvp-dev-only}
      - POSTGRES_DB=${POSTGRES_DB:-acvp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for host tooling (alembic / psql / a GUI)
      # during development. Set DB_HOST_PORT to avoid a clash with a Postgres
      # already listening on 5432. Drop this whole mapping in a locked-down
      # deployment — the backend reaches the DB over the internal compose network.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acvp} -d ${POSTGRES_DB:-acvp}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ACV Proxy — Nginx TLS termination + mTLS (ACVP spec §4.2 SHALL, §6, §7).
  proxy:
    build: ./backend/nginx
    ports:
      - "8080:8080"    # HTTP (redirects to HTTPS)
      - "8443:8443"    # HTTPS with mTLS
    environment:
      # Same secret as the backend; injected into nginx.conf.template at start.
      - PROXY_SECRET=${PROXY_SECRET:?PROXY_SECRET is required - see docs/mtls-deployment.md}
    volumes:
      - ./backend/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=https://localhost:8443/acvp/v1
    depends_on:
      proxy:
        condition: service_started
  # Deployment task queue (the prototype runs jobs in-process, so this is optional):
  # redis:
  #   image: redis:7-alpine
  # worker:
  #   build: { context: ./backend, target: backend }
  #   command: arq app.workers.tasks.WorkerSettings
  #   depends_on:
  #     - redis

# Named volume for the PostgreSQL data directory, managed by Docker/Podman.
# `docker compose down` keeps it; `docker compose down -v` deletes the data.
volumes:
  pgdata:
